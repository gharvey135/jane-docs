name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portal:
    name: Build docs portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  client:
    name: Type-check API client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/jsonplaceholder-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/jsonplaceholder-wrapper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
